# Desktop apps (with the daemon bundled), the Docker image and GitHub
# releases. Every push to main updates the rolling "edge" pre-release and
# the :edge image; version tags (v1.2.3 or 1.2.3) publish a release with :latest. Uses only
# the automatic GITHUB_TOKEN.
name: release

on:
  push:
    branches: [main]
    tags: ["v*", "[0-9]*"] # version tags, with or without the v

permissions:
  contents: write   # create releases
  packages: write   # push to ghcr.io

env:
  GO_VERSION: "1.27.x"
  FLUTTER_CHANNEL: stable

jobs:
  ci:
    # Reuse the full test-and-build workflow so releases never skip tests.
    uses: ./.github/workflows/ci.yml

  linux-app:
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version-file: app/pubspec.yaml # exact version pinned there, shared with the Dockerfile
          cache: true
      - name: Linux desktop dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev libpulse-dev libfuse2 file zip desktop-file-utils
      - uses: actions/download-artifact@v8
        with:
          name: fundus-linux-amd64
          path: dist
      - name: Build the Linux app and package the AppImage
        run: |
          VERSION="$(git describe --tags --exclude edge --always --dirty)"
          mkdir -p bin && cp dist/fundus-linux-amd64 bin/fundus && chmod +x bin/fundus
          (cd app && flutter config --enable-linux-desktop && flutter pub get && flutter build linux --release)
          curl -sSL -o /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          scripts/appimage.sh "${VERSION}" /tmp/appimagetool
      - uses: actions/upload-artifact@v7
        with:
          name: Fundus-linux-appimage
          path: dist/Fundus-*-x86_64.AppImage
      - name: Stage the bundle for Flatpak and Snap
        run: |
          mkdir -p build-input/daemon
          cp -r app/build/linux/x64/release/bundle build-input/bundle
          cp bin/fundus build-input/daemon/fundus
          tar -C build-input -cf linux-bundle.tar .
      - uses: actions/upload-artifact@v7
        with:
          name: linux-bundle
          path: linux-bundle.tar
          retention-days: 3

  flatpak:
    # Single-file .flatpak bundle from the tested binaries (GNOME 49 runtime).
    needs: [linux-app]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: linux-bundle
      - name: Unpack the bundle into the manifest's input directory
        id: prep
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p deploy/flatpak/build-input
          tar -C deploy/flatpak/build-input -xf linux-bundle.tar
          chmod +x deploy/flatpak/build-input/daemon/fundus deploy/flatpak/build-input/bundle/fundus_app
          echo "version=$(git describe --tags --exclude edge --always --dirty)" >> "$GITHUB_OUTPUT"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Fundus-${{ steps.prep.outputs.version }}-x86_64.flatpak
          manifest-path: deploy/flatpak/io.github.fundus_app.fundus.yml
          cache: false
          upload-artifact: false
      - uses: actions/upload-artifact@v7
        with:
          name: Fundus-linux-flatpak
          path: Fundus-*-x86_64.flatpak

  snap:
    # Strictly confined snap from the tested binaries; published to the Snap
    # Store when SNAPCRAFT_STORE_CREDENTIALS is set (edge on main, stable on tags).
    needs: [linux-app]
    runs-on: ubuntu-latest
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: linux-bundle
      - name: Unpack the bundle and set the version
        run: |
          mkdir -p snap/build-input
          tar -C snap/build-input -xf linux-bundle.tar
          chmod +x snap/build-input/daemon/fundus snap/build-input/bundle/fundus_app
          VERSION="$(git describe --tags --exclude edge --always --dirty)"
          sed -i "s/^version: \"0.0.0\".*/version: \"${VERSION}\"/" snap/snapcraft.yaml
          grep '^version:' snap/snapcraft.yaml
      - uses: snapcore/action-build@v1
        id: build
      - uses: actions/upload-artifact@v7
        with:
          name: Fundus-linux-snap
          path: ${{ steps.build.outputs.snap }}
      - name: Publish to the Snap Store
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        uses: snapcore/action-publish@v1
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ startsWith(github.ref, 'refs/tags/') && 'stable' || 'edge' }}

  macos-app:
    needs: [ci]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version-file: app/pubspec.yaml # exact version pinned there, shared with the Dockerfile
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: fundus-darwin-arm64
          path: dist
      - name: Build the macOS app (ad-hoc signed, not notarised)
        run: |
          VERSION="$(git describe --tags --exclude edge --always --dirty)"
          (cd app && flutter config --enable-macos-desktop && flutter pub get && flutter build macos --release)
          BUNDLE="$(ls -d app/build/macos/Build/Products/Release/*.app | head -1)"
          cp dist/fundus-darwin-arm64 "${BUNDLE}/Contents/MacOS/fundus"
          chmod +x "${BUNDLE}/Contents/MacOS/fundus"
          codesign --force --deep --sign - "${BUNDLE}"
          ditto -c -k --keepParent "${BUNDLE}" "dist/Fundus-${VERSION}-macos.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: Fundus-macos
          path: dist/Fundus-*-macos.zip

  windows-app:
    needs: [ci]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version-file: app/pubspec.yaml # exact version pinned there, shared with the Dockerfile
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: fundus-windows-amd64
          path: dist
      - name: Build the Windows app (unsigned)
        shell: pwsh
        run: |
          $version = (git describe --tags --exclude edge --always --dirty)
          Set-Location app
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release
          Set-Location ..
          $bundle = "app\build\windows\x64\runner\Release"
          Copy-Item "dist\fundus-windows-amd64.exe" "$bundle\fundus.exe"
          Compress-Archive -Path "$bundle\*" -DestinationPath "dist\Fundus-$version-windows.zip" -Force
          Get-ChildItem dist
      - uses: actions/upload-artifact@v7
        with:
          name: Fundus-windows
          path: dist/Fundus-*-windows.zip

  docker-push:
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          VERSION="$(git describe --tags --exclude edge --always --dirty)"
          IMAGE="ghcr.io/${{ github.repository_owner }}/fundus"
          # main → :edge, tags → :<version> and :latest
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then TAG2=latest; else TAG2=edge; fi
          docker build -f deploy/Dockerfile --build-arg VERSION="${VERSION}" -t "${IMAGE}:${VERSION}" -t "${IMAGE}:${TAG2}" .
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:${TAG2}"

  release:
    # Version tags: a proper release. main: the rolling "edge" pre-release, whose
    # tag is moved to the current commit and whose files are replaced, so the
    # newest build is always one click away without waiting for a version.
    needs: [linux-app, flatpak, snap, macos-app, windows-app, docker-push]
    runs-on: ubuntu-latest
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Collect
        run: |
          mkdir -p dist
          find artifacts -type f \( -name 'fundus-*' -o -name 'Fundus-*' -o -name 'fundus_*.snap' \) -exec cp {} dist/ \;
          if [ "${IS_TAG}" != "true" ]; then
            # Fixed names so each push replaces the previous edge files.
            VERSION="$(git describe --tags --exclude edge --always --dirty)"
            for f in dist/Fundus-* dist/fundus_*.snap; do [ -e "$f" ] || continue; t="${f/${VERSION}/edge}"; [ "$t" = "$f" ] || mv "$f" "$t"; done
          fi
          (cd dist && sha256sum -- * > SHA256SUMS)
          ls -la dist
      - name: Move the edge tag
        if: env.IS_TAG != 'true'
        run: |
          git tag -f edge
          git push -f origin edge
      - name: Edge pre-release
        if: env.IS_TAG != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: edge
          name: Edge (rolling build of main)
          prerelease: true
          make_latest: false
          body: |
            Automatic build of `main` at ${{ github.sha }}. Replaced on every push; use a versioned release for anything you want to keep.

            Desktop apps are unsigned and not notarised (see the README for the one-time confirmation on macOS and Windows). Linux comes as AppImage, Flatpak bundle and snap. The matching image is `ghcr.io/${{ github.repository_owner }}/fundus:edge`.
          files: dist/*
      - name: Release
        if: env.IS_TAG == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
